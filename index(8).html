<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Tes Pencarian Visual</title>
<style>
  :root{--bg:#f5f6f8;--card:#fff;--ink:#1d2330;--mut:#667085;--line:#dfe3ea;--pri:#2f5bea;--red:#e03131;--blue:#1c64d8;--ok:#2f9e44;--bad:#e03131}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  #app{max-width:860px;margin:0 auto;min-height:100%;padding:16px;display:flex;flex-direction:column;justify-content:center}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
  h1{font-size:22px;margin:0 0 6px} h2{font-size:18px;margin:0 0 10px}
  p{line-height:1.55;margin:8px 0} .mut{color:var(--mut);font-size:14px}
  label{display:block;font-size:14px;font-weight:600;margin:14px 0 5px}
  input,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:16px;background:#fff;color:var(--ink)}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:14px 20px;font-weight:600;font-size:16px;background:var(--pri);color:#fff}
  button.sec{background:#e9ecf3;color:var(--ink)} button:disabled{opacity:.4;cursor:not-allowed}
  .actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
  .check{display:flex;gap:10px;align-items:flex-start;margin:14px 0;font-size:15px;line-height:1.45}
  .check input{width:20px;height:20px;margin-top:2px;flex:none}
  .stage{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;touch-action:manipulation}
  svg{display:block;width:100%;height:auto}
  .resp{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
  .resp button{padding:22px;font-size:20px}
  .bar{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);margin-bottom:8px}
  .prog{height:6px;background:var(--line);border-radius:4px;margin-bottom:10px;overflow:hidden}.prog i{display:block;height:100%;background:var(--pri);width:0}
  .fb{text-align:center;font-weight:700;height:26px;margin-top:8px}
  .demo{display:flex;gap:24px;justify-content:center;margin:14px 0}
  .demo svg{width:96px;height:96px}
  .opts{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0 14px}
  .opts button{background:#e9ecf3;color:var(--ink)} .opts button.on{background:var(--pri);color:#fff}
  table{border-collapse:collapse;width:100%;font-size:14px;margin-top:10px} td,th{border:1px solid var(--line);padding:8px;text-align:center}
  .warn{background:#fff4e5;border:1px solid #ffd8a8;border-radius:10px;padding:10px 12px;font-size:14px;margin-top:12px}
  .hide{display:none}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============ KONFIGURASI (ubah sesuai kebutuhan) ============ */
const CONFIG = {
  SCRIPT_URL: new URLSearchParams(location.search).get("s") || "", // otomatis dari link buatan setup.html (atau isi manual di sini)
  PRACTICE_TRIALS: 8,      // jumlah percobaan latihan (tidak dihitung)
  TRIALS_PER_BLOCK: 50,    // percobaan per blok (2 blok => 100 soal utama; 25 soal per kondisi)
  N_SMALL: 4,              // jumlah pengganggu: sedikit
  N_LARGE: 14,             // jumlah pengganggu: banyak
  FIXATION_MS: 500,        // lama tanda "+"
  ITI_MS: 400,             // jeda antar percobaan
  ERROR_FEEDBACK_MS: 700,  // lama umpan balik saat salah
  MIN_RT: 200, MAX_RT: 5000// batas pembuangan RT (hanya untuk ringkasan; data mentah tetap lengkap)
};
/* ============================================================= */

const W=800, H=480, COLS=8, ROWS=5, CW=W/COLS, CH=H/ROWS, S=46;       // S = sisi persegi
const TA = S*Math.sqrt(4/Math.sqrt(3)), TH = TA*Math.sqrt(3)/2;       // segitiga sama sisi dengan luas sama dengan persegi
const RED="#e03131", BLUE="#1c64d8";
const $=s=>document.querySelector(s), app=$('#app');
const rnd=n=>Math.floor(Math.random()*n);
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};

const state={peserta:{},blockOrder:[],trials:[],practiceDone:false,data:[],sent:null};

/* ---------- bentuk & tampilan ---------- */
function shape(type,color,x,y){
  if(type==='sq') return `<rect x="${x-S/2}" y="${y-S/2}" width="${S}" height="${S}" fill="${color}"/>`;
  const p=[[x,y-TH*2/3],[x-TA/2,y+TH/3],[x+TA/2,y+TH/3]].map(q=>q.map(v=>v.toFixed(1)).join(',')).join(' ');
  return `<polygon points="${p}" fill="${color}"/>`;
}
const fixation=`<svg viewBox="0 0 ${W} ${H}"><path d="M${W/2-14} ${H/2}h28M${W/2} ${H/2-14}v28" stroke="#1d2330" stroke-width="4" stroke-linecap="round"/></svg>`;
const blank=`<svg viewBox="0 0 ${W} ${H}"></svg>`;

// Target: persegi merah. "beda": pengganggu segitiga biru semua.
// "mirip": separuh persegi biru + separuh segitiga merah (masing-masing berbagi satu ciri dengan target).
function makeDisplay(sim,n,side){
  const cells=[];for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)cells.push({r,c});
  const sideCells=cells.filter(k=>side==='kiri'?k.c<COLS/2:k.c>=COLS/2);
  const t=sideCells[rnd(sideCells.length)];
  const rest=shuffle(cells.filter(k=>!(k.r===t.r&&k.c===t.c))).slice(0,n);
  const pos=k=>[k.c*CW+CW/2+(Math.random()*16-8), k.r*CH+CH/2+(Math.random()*16-8)];
  let out=`<svg viewBox="0 0 ${W} ${H}">`;
  const [tx,ty]=pos(t); out+=shape('sq',RED,tx,ty);
  rest.forEach((k,i)=>{
    const [x,y]=pos(k);
    if(sim==='beda') out+=shape('tr',BLUE,x,y);
    else out+= i%2===0 ? shape('sq',BLUE,x,y) : shape('tr',RED,x,y);
  });
  return out+'</svg>';
}

/* ---------- daftar percobaan ---------- */
function buildBlock(sim,total){
  // total soal dibagi ke 2 jumlah pengganggu; kalau ganjil, kelebihannya diundi
  const half=Math.floor(total/2), extra=total%2;
  const bigGetsExtra=Math.random()<.5;
  const counts=[[CONFIG.N_SMALL,half+(extra&&!bigGetsExtra?1:0)],[CONFIG.N_LARGE,half+(extra&&bigGetsExtra?1:0)]];
  const list=[];
  counts.forEach(([n,c])=>{
    let side=Math.random()<.5?'kiri':'kanan';                 // posisi target diseimbangkan (selang-seling)
    for(let i=0;i<c;i++){list.push({sim,n,side});side=side==='kiri'?'kanan':'kiri'}
  });
  return shuffle(list);
}
function buildPractice(){
  const l=[];
  for(let i=0;i<CONFIG.PRACTICE_TRIALS;i++)
    l.push({sim:i%2?'beda':'mirip',n:i%4<2?CONFIG.N_SMALL:CONFIG.N_LARGE,side:i%2?'kiri':'kanan'});
  return shuffle(l);
}
function decideOrder(){
  // setiap peserta langsung diundi: urutan blok "beda" dan "mirip" diacak otomatis
  return Math.random()<.5?['beda','mirip']:['mirip','beda'];
}

/* ---------- layar-layar ---------- */
function show(html){app.innerHTML=html}

function screenIntro(){
  show(`<div class="card">
    <h1>Tes Pencarian Visual</h1>
    <p class="mut">Penelitian atensi selektif · sekitar 10–15 menit</p>
    <p>Terima kasih sudah bersedia ikut. Kamu akan mencari satu bentuk di antara bentuk-bentuk lain, lalu menjawab secepat dan seteliti mungkin. Ini bukan penilaian pintar atau tidaknya kamu, dan kamu boleh berhenti kapan saja.</p>
    <p>Data hanya dipakai untuk penelitian dan dicatat dengan kode peserta, bukan nama.</p>
    <label class="check"><input type="checkbox" id="consent"><span>Saya sudah memahami penjelasan di atas dan bersedia mengikuti penelitian ini.</span></label>
    <div class="actions"><button id="go" disabled>Lanjut</button></div></div>`);
  $('#consent').onchange=e=>$('#go').disabled=!e.target.checked;
  $('#go').onclick=screenData;
}

function screenData(){
  show(`<div class="card"><h2>Data singkat</h2>
    <label>Kode peserta (dari peneliti)</label><input id="kode" placeholder="contoh: P01" autocomplete="off">
    <div class="row"><div><label>Usia (tahun)</label><input id="usia" type="number" inputmode="numeric" min="10" max="30"></div>
    <div><label>Kelas</label><input id="kelas" placeholder="contoh: XI-A"></div></div>
    <label>Apakah kamu buta warna?</label>
    <select id="bw"><option value="">Pilih…</option><option>Tidak</option><option>Ya</option><option>Tidak tahu</option></select>
    <label>Kalau berkacamata, apakah sekarang memakainya?</label>
    <select id="kc"><option value="">Pilih…</option><option>Tidak berkacamata</option><option>Berkacamata dan memakainya</option><option>Berkacamata tapi tidak memakainya</option></select>
    <div id="err" class="warn hide"></div>
    <div class="actions"><button id="go">Lanjut</button></div></div>`);
  $('#go').onclick=()=>{
    const p={kode:$('#kode').value.trim(),usia:$('#usia').value,kelas:$('#kelas').value.trim(),buta_warna:$('#bw').value,kacamata:$('#kc').value};
    if(!p.kode||!p.usia||!p.kelas||!p.buta_warna||!p.kacamata){const e=$('#err');e.textContent='Semua kolom wajib diisi.';e.classList.remove('hide');return}
    if(p.buta_warna==='Ya'){const e=$('#err');e.textContent='Tes ini memakai warna merah dan biru. Mohon panggil peneliti.';e.classList.remove('hide');return}
    p.perangkat=navigator.userAgent; p.layar=`${screen.width}x${screen.height}`; p.mulai=new Date().toISOString();
    state.peserta=p; state.blockOrder=decideOrder(); state.peserta.urutan_blok=state.blockOrder.join('>'); screenColor();
  };
}

function screenColor(){
  const ans={};
  show(`<div class="card"><h2>Pengecekan warna</h2>
    <p>Sebutkan warna masing-masing bentuk berikut.</p>
    <div class="demo"><svg viewBox="0 0 100 100">${shape('sq',RED,50,50)}</svg><svg viewBox="0 0 100 100">${shape('tr',BLUE,50,52)}</svg></div>
    <label>Persegi (kiri)</label><div class="opts" data-q="a">${['Merah','Biru','Hijau'].map(x=>`<button data-v="${x}">${x}</button>`).join('')}</div>
    <label>Segitiga (kanan)</label><div class="opts" data-q="b">${['Merah','Biru','Hijau'].map(x=>`<button data-v="${x}">${x}</button>`).join('')}</div>
    <div id="err" class="warn hide">Jawabannya belum sesuai. Mohon panggil peneliti.</div>
    <div class="actions"><button id="go" disabled>Lanjut</button></div></div>`);
  document.querySelectorAll('.opts').forEach(g=>g.onclick=e=>{
    const b=e.target.closest('button');if(!b)return;
    g.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');
    ans[g.dataset.q]=b.dataset.v;$('#go').disabled=!(ans.a&&ans.b);
  });
  $('#go').onclick=()=>{
    const ok=ans.a==='Merah'&&ans.b==='Biru';
    state.peserta.cek_warna=ok?'lolos':'gagal';
    if(!ok){$('#err').classList.remove('hide');return}
    screenInstruction();
  };
}

function screenInstruction(){
  const demo=makeDisplay('mirip',CONFIG.N_SMALL,'kanan');
  show(`<div class="card"><h2>Cara mengerjakan</h2>
    <p>1. Lihat tanda <b>+</b> di tengah layar.</p>
    <p>2. Lalu muncul banyak bentuk. Cari <b style="color:${RED}">persegi merah</b> (selalu ada satu).</p>
    <p>3. Tekan <b>Kiri</b> kalau persegi merah ada di <b>separuh layar kiri</b>, tekan <b>Kanan</b> kalau di separuh kanan. Bisa lewat tombol atau tombol panah ← →.</p>
    <p>Kerjakan <b>secepat dan seteliti mungkin</b>. Contoh tampilan (persegi merah ada di kanan):</p>
    <div class="stage">${demo}</div>
    <p class="mut">Pertama ada ${CONFIG.PRACTICE_TRIALS} percobaan latihan dengan umpan balik, tidak dihitung.</p>
    <div class="actions"><button id="go">Mulai latihan</button></div></div>`);
  $('#go').onclick=()=>runPhase('latihan',buildPractice(),0,()=>screenAfterPractice());
}

function screenAfterPractice(){
  show(`<div class="card"><h2>Latihan selesai</h2>
    <p>Tugas utama terdiri dari <b>${CONFIG.TRIALS_PER_BLOCK*2} percobaan</b> yang dibagi menjadi <b>2 blok</b> (masing-masing ${CONFIG.TRIALS_PER_BLOCK} percobaan), dengan istirahat di antaranya. Umpan balik hanya muncul kalau jawabanmu salah.</p>
    <div class="actions"><button id="go">Mulai tugas utama</button></div></div>`);
  $('#go').onclick=()=>startBlock(0);
}

function startBlock(i){
  const sim=state.blockOrder[i];
  runPhase('utama',buildBlock(sim,CONFIG.TRIALS_PER_BLOCK),i+1,()=>{
    if(i===0) screenRest(); else finish();
  });
}

function screenRest(){
  show(`<div class="card"><h2>Istirahat sebentar</h2>
    <p>Blok pertama selesai. Lemaskan matamu, lalu lanjut kalau sudah siap. Aturannya sama, hanya bentuk-bentuk di layarnya yang sedikit berbeda.</p>
    <div class="actions"><button id="go">Lanjut blok kedua</button></div></div>`);
  $('#go').onclick=()=>startBlock(1);
}

/* ---------- mesin percobaan ---------- */
function runPhase(fase,list,blok,done){
  let i=0,accepting=false,t0=0,cur=null,timer=null;
  show(`<div><div class="bar"><span>${fase==='latihan'?'Latihan':'Blok '+blok+' dari 2'}</span><span id="cnt"></span></div>
    <div class="prog"><i id="pg"></i></div>
    <div class="stage" id="stage"></div>
    <div class="fb" id="fb"></div>
    <div class="resp"><button id="bl">◀ Kiri</button><button id="br">Kanan ▶</button></div>
    <p class="mut" style="text-align:center">Di mana persegi merah? (tombol ← →)</p></div>`);
  const stage=$('#stage'),fb=$('#fb');
  const onKey=e=>{if(e.key==='ArrowLeft')answer('kiri');else if(e.key==='ArrowRight')answer('kanan')};
  document.addEventListener('keydown',onKey);
  $('#bl').onpointerdown=e=>{e.preventDefault();answer('kiri')};
  $('#br').onpointerdown=e=>{e.preventDefault();answer('kanan')};

  function next(){
    if(i>=list.length){document.removeEventListener('keydown',onKey);done();return}
    cur=list[i];$('#cnt').textContent=`${i+1} / ${list.length}`;$('#pg').style.width=(i/list.length*100)+'%';
    fb.textContent='';stage.innerHTML=fixation;
    timer=setTimeout(()=>{
      stage.innerHTML=makeDisplay(cur.sim,cur.n,cur.side);
      requestAnimationFrame(()=>{t0=performance.now();accepting=true});
    },CONFIG.FIXATION_MS);
  }
  function answer(resp){
    if(!accepting)return;accepting=false;
    const rt=Math.round(performance.now()-t0), ok=resp===cur.side;
    state.data.push({kode:state.peserta.kode,urutan_blok:state.blockOrder.join('>'),fase,blok:blok||0,no_trial:i+1,
      kemiripan:cur.sim,jumlah_pengganggu:cur.n,posisi_target:cur.side,respons:resp,benar:ok?1:0,rt_ms:rt,waktu:new Date().toISOString()});
    stage.innerHTML=blank;
    let wait=CONFIG.ITI_MS;
    if(fase==='latihan'||!ok){fb.style.color=ok?'var(--ok)':'var(--bad)';fb.textContent=ok?'Benar ✓':'Salah ✗';if(!ok)wait=CONFIG.ERROR_FEEDBACK_MS}
    i++;timer=setTimeout(next,wait);
  }
  next();
}

/* ---------- selesai & pengiriman data ---------- */
const COLS_CSV=['kode','urutan_blok','fase','blok','no_trial','kemiripan','jumlah_pengganggu','posisi_target','respons','benar','rt_ms','waktu'];
function toCSV(){
  const esc=v=>`"${String(v).replace(/"/g,'""')}"`;
  return [COLS_CSV.join(',')].concat(state.data.map(r=>COLS_CSV.map(k=>esc(r[k])).join(','))).join('\n');
}
function downloadCSV(){
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([toCSV()],{type:'text/csv'}));
  a.download=`visual_search_${state.peserta.kode}.csv`;a.click();
}
function summary(){
  const out={};
  state.data.filter(r=>r.fase==='utama').forEach(r=>{
    const k=r.kemiripan+'|'+r.jumlah_pengganggu;(out[k]=out[k]||[]).push(r)});
  return Object.keys(out).sort().map(k=>{
    const rows=out[k],acc=rows.reduce((s,r)=>s+r.benar,0)/rows.length;
    const rts=rows.filter(r=>r.benar&&r.rt_ms>=CONFIG.MIN_RT&&r.rt_ms<=CONFIG.MAX_RT).map(r=>r.rt_ms);
    const m=rts.length?Math.round(rts.reduce((a,b)=>a+b,0)/rts.length):'-';
    const [s,n]=k.split('|');return {s,n,m,acc:Math.round(acc*100),jml:rows.length};
  });
}
async function send(){
  const payload={peserta:{...state.peserta,selesai:new Date().toISOString()},trials:state.data};
  try{localStorage.setItem('vs_backup_'+state.peserta.kode,JSON.stringify(payload))}catch(e){}
  if(!CONFIG.SCRIPT_URL){state.sent='uji';return}
  for(let a=0;a<3;a++){
    try{
      await fetch(CONFIG.SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});
      state.sent='ok';return;
    }catch(e){await new Promise(r=>setTimeout(r,1500))}
  }
  state.sent='gagal';
}
async function finish(){
  show(`<div class="card"><h2>Menyimpan data…</h2><p class="mut">Mohon tunggu sebentar.</p></div>`);
  await send();
  const debug=new URLSearchParams(location.search).has('debug');
  const msg={ok:'Datamu sudah tersimpan. Terima kasih!',
    uji:'Link tes ini belum tersambung ke penyimpanan data. Mohon beri tahu peneliti.',
    gagal:'Data belum berhasil tersimpan. Pastikan internet menyala, lalu tekan tombol di bawah.'}[state.sent];
  const tbl=debug?`<table><tr><th>Kemiripan</th><th>Jumlah</th><th>RT rata-rata (ms)</th><th>Akurasi</th></tr>${
    summary().map(r=>`<tr><td>${r.s}</td><td>${r.n}</td><td>${r.m}</td><td>${r.acc}%</td></tr>`).join('')}</table>`:'';
  show(`<div class="card"><h1>Selesai 🎉</h1>
    <p>${msg}</p>
    <p>Tujuan penelitian: kami ingin melihat bagaimana atensi selektif bekerja saat bentuk pengganggu mirip atau berbeda dari target, dan saat jumlahnya sedikit atau banyak. Jawabanmu tidak dinilai benar atau salah secara pribadi.</p>
    ${tbl}
    <div class="actions">${state.sent==='gagal'?'<button id="rt">Coba kirim lagi</button>':''}${debug?'<button class="sec" id="dl">Unduh CSV</button>':''}</div></div>`);
  if($('#dl'))$('#dl').onclick=downloadCSV;
  if($('#rt'))$('#rt').onclick=finish;
}

screenIntro();
</script>
</body>
</html>
